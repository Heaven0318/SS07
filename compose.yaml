services:
  ss07:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /app/data
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ss07_usage:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  ss07_usage:
