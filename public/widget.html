<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content"><title>SS07</title><link rel="stylesheet" href="/widget.css"><script src="/widget.js" defer></script></head>
<body><main id="panel" aria-label="SS07 chat">
  <header><div class="identity"><span class="mark" aria-hidden="true">✦</span><div><h1>SS07</h1><p>Your portfolio guide · AI</p></div></div><div class="actions"><button id="reset" aria-label="Start Over, clear this conversation" title="Start Over">↺</button><button id="close" aria-label="Close SS07" title="Close">×</button></div></header>
  <div id="availability" role="status" hidden></div>
  <section id="messages" aria-label="Conversation" tabindex="0"></section>
  <div id="suggestions" aria-label="Suggested questions"></div>
  <details id="browse"><summary>Browse sections</summary><div id="browse-actions" class="nav-row"></div></details>
  <button id="latest" hidden>↓ Jump to latest</button>
  <div id="error" role="alert" hidden><span id="error-text"></span><button id="retry">Retry</button></div>
  <form id="composer"><label class="sr-only" for="input">Message SS07</label><div class="compose-row"><textarea id="input" rows="2" maxlength="4000" placeholder="Ask about this portfolio…"></textarea><button id="send" type="button" aria-label="Send message">↑</button></div><div class="hint"><span>Enter to send · Shift + Enter for a new line</span><span id="counter">0 / 4000</span></div></form>
  <footer id="privacy">Messages go to an AI provider. Google's free tier may use them to improve its products.<br>Avoid sensitive information. Chat clears on reload.</footer>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
</main></body></html>
